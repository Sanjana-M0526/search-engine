services:
  - type: web
    name: my-search-engine
    runtime: python
    plan: free

    buildCommand: pip install -r app/backend/requirements.txt

    startCommand: cd app/backend && uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13

      - key: DATA_DIR
        value: /tmp/search-data